name: Deploy to GitHub Pages

# Reliable static deploy for EMBER. Replaces the legacy "build from branch"
# pipeline. Requires Settings → Pages → Source = "GitHub Actions" (one-time).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Queue deploys instead of cancelling them. With an approval-gated github-pages
# environment, cancel-in-progress:true would cancel a pending deploy the moment a
# newer merge lands, so nothing ever publishes. false lets each queued deploy run
# to completion in order.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
